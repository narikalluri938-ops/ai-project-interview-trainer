{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-5 border shadow-sm">
        <div class="display-1 text-primary fw-bold mb-3">404</div>
        <h4 class="fw-bold mb-2">Project or Page Not Found</h4>
        <p class="text-secondary small mb-4">
          The requested page or project preparation session could not be found. It may have been removed or the URL might be incorrect.
        </p>
        <div>
          <a href="{{ url_for('main.index') }}" class="btn btn-primary">
            <i class="bi bi-house me-1"></i> Return Home
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
