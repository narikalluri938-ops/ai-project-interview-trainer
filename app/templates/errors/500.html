{% extends "base.html" %}

{% block title %}Application Error (500){% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-5 border shadow-sm">
        <div class="display-1 text-danger fw-bold mb-3">500</div>
        <h4 class="fw-bold mb-2">Something Went Wrong</h4>
        <p class="text-secondary small mb-4">
          Our service encountered a temporary error while processing your request. Please try again or return to the dashboard.
        </p>
        <div class="d-flex justify-content-center gap-2">
          <a href="{{ url_for('main.index') }}" class="btn btn-primary">
            <i class="bi bi-house me-1"></i> Return Home
          </a>
          <button onclick="window.history.back()" class="btn btn-outline-secondary">
            Go Back
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
