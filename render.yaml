services:
  - type: web
    name: ai-project-interview-trainer
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --workers 2 --threads 4 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: mock
      - key: AI_MODEL
        value: gemini-2.5-flash
      # Optional: To persist data across container restarts, link to a Render PostgreSQL database:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: interview-trainer-db
      #     property: connectionString

